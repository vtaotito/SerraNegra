<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B Pages Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #333;
            margin: 20px 0;
        }
        h2 {
            margin-top: 30px;
        }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>B2B Portal Pages Test</h1>
        
        <div class="info">
            <h3>Console Errors:</h3>
            <div id="errors"></div>
        </div>

        <h2>1. Main B2B Page (http://31.97.174.120:8080/b2b)</h2>
        <iframe src="http://31.97.174.120:8080/b2b" id="mainFrame"></iframe>

        <h2>2. Login Page (http://31.97.174.120:8080/b2b/login)</h2>
        <iframe src="http://31.97.174.120:8080/b2b/login" id="loginFrame"></iframe>
    </div>

    <script>
        // Capture console errors
        const errorDiv = document.getElementById('errors');
        const originalError = console.error;
        console.error = function(...args) {
            const errorMsg = args.join(' ');
            const p = document.createElement('p');
            p.style.color = 'red';
            p.textContent = new Date().toISOString() + ': ' + errorMsg;
            errorDiv.appendChild(p);
            originalError.apply(console, args);
        };

        // Listen for iframe errors
        window.addEventListener('error', function(e) {
            const p = document.createElement('p');
            p.style.color = 'red';
            p.textContent = 'Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
            errorDiv.appendChild(p);
        }, true);
    </script>
</body>
</html>
