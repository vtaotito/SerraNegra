# Configuração do subdomínio painel.garrafariaserranegra.com.br
# Adicionar como server block adicional ou incluir via include no nginx.conf principal do servidor.
#
# Para uso com Hostinger ou VPS, adicione este bloco ao nginx de produção
# e configure o certificado SSL com Let's Encrypt (certbot).

server {
    listen 80;
    server_name painel.garrafariaserranegra.com.br;

    # Redirecionar HTTP → HTTPS em produção
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name painel.garrafariaserranegra.com.br;

    # Certificados SSL (Let's Encrypt via certbot)
    ssl_certificate /etc/letsencrypt/live/painel.garrafariaserranegra.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/painel.garrafariaserranegra.com.br/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Painel Next.js app
    location / {
        proxy_pass http://painel_upstream/painel/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets
    location /_next/ {
        proxy_pass http://painel_upstream/_next/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API requests proxied ao gateway
    location /api/ {
        proxy_pass http://gateway_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
        proxy_buffering off;
    }

    # WMS
    location /wms/ {
        proxy_pass http://web_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal B2B
    location /b2b/ {
        proxy_pass http://portalb2b_upstream/b2b/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /ws {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
