worker_processes  auto;

events { worker_connections  1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  # DNS interno do Docker. Usar resolver + proxy_pass com variavel faz o nginx
  # RE-RESOLVER o IP dos containers em runtime (TTL de 10s). Sem isto, o nginx
  # resolve o hostname so no boot e cacheia o IP "para sempre"; quando um upstream
  # (ex.: gateway) e recriado e troca de IP, todas as chamadas passam a dar 502.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # Health do reverse proxy
    location = /health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # API Gateway - rotas /api/* (remove o prefixo /api antes de repassar)
    location /api/ {
      set $gateway_upstream "gateway:3000";
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$gateway_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;

      proxy_read_timeout 120s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 60s;

      # SSE precisa desabilitar buffering
      proxy_buffering off;
      proxy_cache off;
    }

    # WebSocket upgrade
    location /ws {
      set $gateway_ws "gateway:3000";
      proxy_pass http://$gateway_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }

    # Portal B2B - subdiretorio /b2b
    location /b2b {
      set $portalb2b_upstream "portalb2b:3000";
      proxy_pass http://$portalb2b_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Cockpit BI - subdiretorio /cockpit
    location /cockpit {
      set $cockpit_upstream "cockpit:3000";
      proxy_pass http://$cockpit_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend principal - assets Next.js
    location /_next/ {
      set $web_next_upstream "web:3000";
      proxy_pass http://$web_next_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    # Frontend SPA - servir da aplicacao web
    location / {
      set $web_upstream "web:3000";
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
