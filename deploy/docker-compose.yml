services:
  postgres:
    image: postgres:16-alpine
    container_name: wms-postgres
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wms -d wms"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  core:
    container_name: wms-core
    build:
      context: ..
      dockerfile: core/Dockerfile
    environment:
      CORE_PORT: "8000"
      DATABASE_URL: "postgresql+psycopg://wms:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/wms"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SERVICE_NAME: "wms-core"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:-prod-secret-change-me}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  gateway:
    container_name: wms-gateway
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_PORT: "3000"
      CORE_BASE_URL: "http://core:8000"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SERVICE_NAME: "wms-gateway"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:-prod-secret-change-me}"
      SAP_B1_BASE_URL: "${SAP_B1_BASE_URL}"
      SAP_B1_COMPANY_DB: "${SAP_B1_COMPANY_DB}"
      SAP_B1_USERNAME: "${SAP_B1_USERNAME}"
      SAP_B1_PASSWORD: "${SAP_B1_PASSWORD}"
      SAP_B1_TIMEOUT_MS: "${SAP_B1_TIMEOUT_MS:-20000}"
      SAP_B1_MAX_ATTEMPTS: "${SAP_B1_MAX_ATTEMPTS:-5}"
      SAP_B1_MAX_CONCURRENT: "${SAP_B1_MAX_CONCURRENT:-8}"
      SAP_B1_MAX_RPS: "${SAP_B1_MAX_RPS:-10}"
      # Janela/lote de enriquecimento das linhas de pedido (cobertura de 12 meses no catálogo)
      SAP_LINES_ENRICH_DAYS: "${SAP_LINES_ENRICH_DAYS:-400}"
      SAP_LINES_ENRICH_CONCURRENCY: "${SAP_LINES_ENRICH_CONCURRENCY:-10}"
      SAP_LINES_ENRICH_BATCH: "${SAP_LINES_ENRICH_BATCH:-2000}"
      B2B_DATABASE_URL: "postgresql://wms:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/wms"
      B2B_JWT_SECRET: "${B2B_JWT_SECRET:-b2b-secret-change-me}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-noreply@garrafariaserranegra.com.br}"
      # E-mail transacional (Resend) — preferido; SMTP acima é fallback
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-Garrafaria Serra Negra <noreply@garrafariaserranegra.com.br>}"
      EMAIL_SUPPORT: "${EMAIL_SUPPORT:-comercial@garrafariaserranegra.com.br}"
      EMAIL_COMMERCIAL: "${EMAIL_COMMERCIAL:-comercial@garrafariaserranegra.com.br}"
      B2B_PORTAL_URL: "${B2B_PORTAL_URL:-https://garrafariaserranegra.com.br/b2b}"
      # Upload de imagens de produto (Gestão de Catálogo do admin) — persistido em volume.
      UPLOADS_DIR: "/app/uploads"
      B2B_PUBLIC_UPLOADS_BASE: "${B2B_PUBLIC_UPLOADS_BASE:-}"
      PAINEL_URL: "${PAINEL_URL:-https://painel.garrafariaserranegra.com.br}"
      # RD Station Marketing — captura de leads do Portal B2B (fire-and-forget)
      RD_STATION_API_TOKEN: "${RD_STATION_API_TOKEN:-}"
      RD_STATION_MARKETING_ACCESS_TOKEN: "${RD_STATION_MARKETING_ACCESS_TOKEN:-}"
      RD_STATION_CONVERSION_IDENTIFIER: "${RD_STATION_CONVERSION_IDENTIFIER:-Cadastro Portal B2B}"
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # O hostname do servidor e garrafariaserranegra.com.br, entao /etc/hosts do
    # host resolve o dominio para 127.0.1.1 (loopback). Para o sync do catalogo
    # buscar imagens/descricoes do WooCommerce, mapeamos o dominio para o IP
    # publico real (Hostinger). Ajustavel via WOO_HOST_IP no .env.
    extra_hosts:
      - "garrafariaserranegra.com.br:${WOO_HOST_IP:-147.79.90.205}"
    volumes:
      # Persiste as imagens enviadas pelo admin entre deploys (releases descartáveis).
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    container_name: wms-worker
    build:
      context: ..
      dockerfile: worker/Dockerfile
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SERVICE_NAME: "wms-worker"
      POLL_INTERVAL_SECONDS: "30"
      INTERNAL_SHARED_SECRET: "${INTERNAL_SHARED_SECRET:-prod-secret-change-me}"
      CORE_INTERNAL_BASE_URL: "http://core:8000"
      GATEWAY_INTERNAL_BASE_URL: "http://gateway:3000"
      SAP_BASE_URL: "${SAP_B1_BASE_URL}"
      SAP_COMPANY_DB: "${SAP_B1_COMPANY_DB}"
      SAP_USERNAME: "${SAP_B1_USERNAME}"
      SAP_PASSWORD: "${SAP_B1_PASSWORD}"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

  web:
    container_name: wms-web
    build:
      context: ..
      dockerfile: web-next/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "/api"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5

  portalb2b:
    container_name: wms-portalb2b
    build:
      context: ..
      dockerfile: portalb2b/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "/api"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    # next/image otimiza no servidor (busca a imagem de origem). Como o hostname
    # do servidor e garrafariaserranegra.com.br, o dominio resolve para 127.0.1.1
    # neste container e a otimizacao das imagens do WooCommerce falharia.
    # Mapeamos para o IP publico real (ajustavel via WOO_HOST_IP no .env).
    extra_hosts:
      - "garrafariaserranegra.com.br:${WOO_HOST_IP:-147.79.90.205}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/b2b"]
      interval: 10s
      timeout: 3s
      retries: 5

  painel:
    container_name: wms-painel
    build:
      context: ..
      dockerfile: painel/Dockerfile
    environment:
      DATABASE_URL: "postgresql://wms:${POSTGRES_PASSWORD:-CHANGE_ME}@postgres:5432/wms"
      PANEL_JWT_SECRET: "${PANEL_JWT_SECRET:-painel-secret-change-me-in-production}"
      NEXT_PUBLIC_WMS_BASE_URL: "${WMS_BASE_URL:-http://31.97.174.120:8080}"
      GATEWAY_INTERNAL_URL: "http://gateway:3000"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Credenciais admin B2B (mesmas do gateway) — usadas server-side em /api/b2b-admin/*
      B2B_ADMIN_USER: "${B2B_ADMIN_USER:-admin}"
      B2B_ADMIN_PASSWORD: "${B2B_ADMIN_PASSWORD:-gsn@comercial2026}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-Garrafaria Serra Negra <noreply@garrafariaserranegra.com.br>}"
      # E-mail transacional (Resend) — preferido; SMTP acima é fallback
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-Garrafaria Serra Negra <noreply@garrafariaserranegra.com.br>}"
      EMAIL_SUPPORT: "${EMAIL_SUPPORT:-comercial@garrafariaserranegra.com.br}"
      # RD Station (APIs Route Handlers /api/bi/rd — ver painel/.env.example)
      RD_STATION_CRM_ACCESS_TOKEN: "${RD_STATION_CRM_ACCESS_TOKEN:-}"
      RD_STATION_MARKETING_ACCESS_TOKEN: "${RD_STATION_MARKETING_ACCESS_TOKEN:-}"
    ports:
      - "3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  cockpit:
    container_name: wms-cockpit
    build:
      context: ..
      dockerfile: cockpit/front-cockpit/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/cockpit"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    container_name: wms-nginx
    build:
      context: ..
      dockerfile: nginx/Dockerfile
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_healthy
      portalb2b:
        condition: service_healthy
      cockpit:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
